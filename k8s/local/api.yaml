apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpilot-api
  namespace: finpilot
  labels:
    app: finpilot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finpilot-api
  template:
    metadata:
      labels:
        app: finpilot-api
    spec:
      containers:
        - name: api
          image: finpilot-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: finpilot-config
            - secretRef:
                name: finpilot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
