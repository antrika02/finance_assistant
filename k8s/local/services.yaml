apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: finpilot
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: finpilot-api
  namespace: finpilot
  labels:
    app: finpilot-api
spec:
  type: ClusterIP
  selector:
    app: finpilot-api
  ports:
    - name: http
      port: 8000
      targetPort: http
