[project]
name = "personal-finance-agent"
version = "0.1.0"
description = "AI-powered personal finance management backend built with FastAPI, PostgreSQL, JWT Authentication, Google Gemini AI, and ReportLab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "google-genai>=2.16.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]
